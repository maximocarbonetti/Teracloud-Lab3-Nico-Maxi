<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sovngarde Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Cielo de Sovngarde: estrellas + cintas de aurora -->
  <div class="sky" aria-hidden="true">
    <div class="stars"></div>
    <div class="aurora aurora-1"></div>
    <div class="aurora aurora-2"></div>
    <div class="aurora aurora-3"></div>
    <!-- Paisaje: montañas lejanas y el gran salon al fondo -->
    <svg class="landscape" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMax slice" aria-hidden="true">

      <!-- Cordillera lejana -->
      <path class="range range-far" d="M0,430 L90,318 L150,362 L232,268 L300,340 L372,244 L452,336 L520,300
        L596,352 L668,286 L742,348 L820,262 L900,344 L972,302 L1048,356 L1120,276 L1200,340
        L1274,296 L1352,354 L1428,290 L1510,346 L1600,300 L1600,520 L0,520 Z" />

      <!-- Cordillera cercana -->
      <path class="range range-near" d="M0,470 L120,392 L210,438 L310,360 L410,432 L500,398 L600,452
        L700,384 L800,440 L900,396 L1010,450 L1110,388 L1220,442 L1320,400 L1430,448 L1540,404
        L1600,436 L1600,520 L0,520 Z" />

      <!-- Gran salon: escalinata, columnas, techo a dos aguas -->
      <g class="hall-ruin">
        <path class="hall-roof" d="M800,196 L992,318 L608,318 Z" />
        <rect class="hall-beam" x="596" y="316" width="408" height="14" />
        <rect class="hall-col" x="628" y="330" width="26" height="128" />
        <rect class="hall-col" x="692" y="330" width="26" height="128" />
        <rect class="hall-col" x="756" y="330" width="26" height="128" />
        <rect class="hall-col" x="818" y="330" width="26" height="128" />
        <rect class="hall-col" x="882" y="330" width="26" height="128" />
        <rect class="hall-col" x="946" y="330" width="26" height="128" />
        <path class="hall-arch" d="M786,458 L786,392 A14,14 0 0 1 814,392 L814,458 Z" />
        <rect class="hall-step" x="566" y="458" width="468" height="12" />
        <rect class="hall-step" x="540" y="470" width="520" height="12" />
        <rect class="hall-step" x="514" y="482" width="572" height="14" />
        <path class="hall-spire" d="M800,196 L806,168 L800,150 L794,168 Z" />
      </g>
    </svg>

    <div class="fog"></div>
  </div>

  <!-- Dragon en pixel art con el estandarte colgando de la cola -->
  <div class="dragon-flight" aria-hidden="true">
    <div class="dragon-rig">
      <svg class="dragon" viewBox="0 0 64 32" shape-rendering="crispEdges" role="presentation">
        <g class="dragon-body">
          <rect x="6"  y="14" width="6" height="4" />
          <rect x="4"  y="15" width="2" height="2" />
          <rect x="12" y="13" width="10" height="6" />
          <rect x="22" y="12" width="12" height="8" />
          <rect x="34" y="14" width="8" height="5" />
          <rect x="42" y="15" width="6" height="4" />
          <rect x="48" y="16" width="6" height="3" />
          <rect x="54" y="17" width="5" height="2" />
          <rect x="10" y="12" width="3" height="2" />
          <rect x="16" y="10" width="3" height="3" />
        </g>
        <g class="dragon-eye"><rect x="8" y="15" width="1" height="1" /></g>
        <g class="wing wing-up">
          <rect x="24" y="4"  width="10" height="3" />
          <rect x="22" y="7"  width="12" height="3" />
          <rect x="24" y="10" width="8"  height="2" />
        </g>
        <g class="wing wing-down">
          <rect x="24" y="20" width="8"  height="2" />
          <rect x="22" y="22" width="12" height="3" />
          <rect x="24" y="25" width="10" height="3" />
        </g>
      </svg>

      <!-- Cuerdas + estandarte colgado de la cola -->
      <div class="banner">
        <span class="banner-rope banner-rope-a"></span>
        <span class="banner-rope banner-rope-b"></span>
        <div class="banner-board">
          <img src="img/teracloud.png" alt="Teracloud" class="banner-img" onerror="this.classList.add('is-missing')" />
          <span class="banner-fallback">teracloud</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Nombre de la app -->
  <header class="brand">
    <h1 class="brand-name">Sovngarde<span>Notes</span></h1>
    <p class="brand-tag">El salon de los tomos recordados</p>
  </header>

  <!-- Buscador -->
  <div class="search-wrap">
    <label class="search-label" for="search">Busca entre los tomos</label>
    <div class="search-field">
      <input id="search" type="search" autocomplete="off" placeholder="Un titulo, un autor, una palabra..." />
    </div>
    <p class="search-hint" id="search-hint" aria-live="polite"></p>
  </div>

  <!-- Escenario principal -->
  <main class="hall">

    <!-- Biblioteca izquierda: mis notas -->
    <aside class="shelf shelf-mine">
      <h2 class="shelf-title">Tus tomos</h2>
      <div class="shelf-body" id="shelf-mine"></div>
      <p class="shelf-count" id="count-mine">0</p>
    </aside>

    <!-- Ronda de libros -->
    <section class="stage" aria-label="Ronda de tomos">
      <div class="ring-floor"></div>
      <div class="ring-scene">
        <div class="ring-zoom" id="ring-zoom">
          <div class="ring" id="ring"></div>
        </div>
      </div>
      <p class="stage-empty" id="stage-empty">La ronda esta vacia. Escribe el primer tomo.</p>
    </section>

    <!-- Biblioteca derecha: notas de otros -->
    <aside class="shelf shelf-others">
      <h2 class="shelf-title">Tomos de otros</h2>
      <div class="shelf-body" id="shelf-others"></div>
      <p class="shelf-count" id="count-others">0</p>
    </aside>

  </main>

  <!-- Escritura -->
  <section class="compose">
    <p class="compose-prompt">¿Que nota quieres escribir viajero?</p>
    <form id="nota-form" class="compose-form">
      <input id="titulo" type="text" maxlength="120" required
             class="compose-title" placeholder="Titulo del tomo" />
      <textarea id="texto" maxlength="1000" required
                placeholder="Deja aqui tu relato..."></textarea>
      <button type="submit" class="compose-btn">Grabar el tomo</button>
    </form>
    <p class="compose-status" id="status-msg" aria-live="polite"></p>
  </section>

  <!-- Cofre con el enlace al repositorio -->
  <a class="chest" id="chest"
     href="https://github.com/maximocarbonetti/Teracloud-Lab3-Nico-Maxi"
     target="_blank" rel="noopener noreferrer"
     aria-label="Abrir el repositorio del proyecto en GitHub">
    <svg class="chest-art" viewBox="0 0 48 40" shape-rendering="crispEdges" aria-hidden="true">
      <g class="chest-lid">
        <rect x="4"  y="10" width="40" height="10" class="wood" />
        <rect x="4"  y="10" width="40" height="2"  class="iron" />
        <rect x="12" y="10" width="4"  height="10" class="iron" />
        <rect x="32" y="10" width="4"  height="10" class="iron" />
      </g>
      <g class="chest-base">
        <rect x="4"  y="20" width="40" height="16" class="wood" />
        <rect x="4"  y="34" width="40" height="2"  class="iron" />
        <rect x="12" y="20" width="4"  height="16" class="iron" />
        <rect x="32" y="20" width="4"  height="16" class="iron" />
        <rect x="22" y="22" width="4"  height="5"  class="gold" />
      </g>
    </svg>
    <svg class="chest-mark" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
    </svg>
  </a>

  <!-- Libro abierto (modal) -->
  <div class="reader" id="reader" hidden>
    <div class="reader-veil" data-close></div>
    <div class="reader-book" role="dialog" aria-modal="true" aria-labelledby="reader-title">
      <div class="reader-page reader-page-left">
        <h3 class="reader-tome-title" id="reader-title"></h3>
        <p class="reader-eyebrow">Escrito por</p>
        <p class="reader-author"></p>
        <p class="reader-date"></p>
        <p class="reader-id"></p>
      </div>
      <div class="reader-spine"></div>
      <div class="reader-page reader-page-right">
        <p class="reader-text"></p>
      </div>
      <button class="reader-close" data-close aria-label="Cerrar el tomo">Cerrar</button>
    </div>
  </div>

  <!-- Bienvenida: nombre del viajero -->
  <div class="gate" id="gate" hidden>
    <div class="gate-card">
      <h2>Antes de entrar al salon</h2>
      <p>Los tomos llevan el nombre de quien los escribe. ¿Como te llamas, viajero?</p>
      <form id="gate-form">
        <input id="gate-name" type="text" maxlength="80" required autocomplete="name"
               placeholder="Tu nombre" />
        <button type="submit">Cruzar el puente</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
