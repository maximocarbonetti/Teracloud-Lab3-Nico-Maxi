<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anotador - Lab 2</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>📝 Anotador</h1>
      <p class="subtitle">Laboratorio 2 — ECS + ALB + MySQL en EFS</p>
    </header>

    <form id="nota-form">
      <textarea id="texto" placeholder="Escribí una nota..." maxlength="1000" required></textarea>
      <button type="submit">Guardar nota</button>
    </form>

    <p id="status-msg"></p>

    <section id="notas-list" aria-live="polite"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
